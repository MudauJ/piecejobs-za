kind = "mobile"
previewPath = "/piecejobs-mobile/"
title = "PieceJobs ZA Mobile"
description = "A React Native / Expo companion app for PieceJobs ZA. Homeowners can post jobs, view applications, accept or decline applicants, and mark jobs complete. Workers can browse open jobs in their city, apply with a message and proposed rate, and receive acceptance notifications — all from their phone using the same Supabase backend as the web app."
version = "1.0.0"
id = "artifacts/piecejobs-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/piecejobs-mobile/" ]
localPort = 25245

[services.development]
run = "pnpm --filter @workspace/piecejobs-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/piecejobs-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/piecejobs-mobile", "run", "serve" ]

[services.env]
PORT = "25245"
BASE_PATH = "/piecejobs-mobile/"
